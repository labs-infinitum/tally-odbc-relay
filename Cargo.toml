[package]
name = "tally-odbc-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Localhost HTTP relay that runs TallyPrime ODBC SQL queries and returns JSON."
readme = "README.md"
keywords = ["tally", "tallyprime", "odbc", "accounting"]
categories = ["command-line-utilities", "finance"]

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "net", "signal"] }

[target.'cfg(windows)'.dependencies]
odbc-api = "29"
winreg = "0.55"
